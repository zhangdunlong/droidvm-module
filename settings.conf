# ============================================================
# DroidVM 配置文件（安装时可修改，改后执行 mgmt.sh restart 生效）
# ============================================================

# ---- 虚拟机资源 ----
# 内存(MB)。建议为手机总内存的 25%~50%；留足给 Android 前台应用
VM_MEM=4096
# CPU 核数（1-8）。建议物理核数的一半以下，避免卡顿
VM_SMP=4

# ---- 端口映射（宿主安卓端口 -> 虚拟机） ----
# 格式: 宿主端口:虚拟机端口，多个用空格分隔
# 默认: 2222=SSH 10086=1Panel 3080=agent2api 5700=青龙 5244=AList
VM_PORTS="2222:22 10086:10086 5700:5700 3065:3065 5244:5244"

# ---- 数据盘 ----
# 全新安装时从模块模板复制；已存在则不覆盖（保护数据）
VM_DISK_AUTO=1
# 高级：指定自定义 qcow2 路径（留空则使用默认位置）
VM_DISK_CUSTOM=""

# ---- 开机自启 ----
# 1=开机自动启动虚拟机  0=仅安装，手动 mgmt.sh start 启动
AUTOSTART=1
# 开机后等待多少秒再启动（等系统就绪，避免争抢资源）
BOOT_DELAY=45

# ---- 首次装配凭据（cloud-init / 1Panel） ----
# !! 首次启动虚拟机后请立即登录修改这些密码 !!
DVM_PASSWORD='DroidVM2026!'
PANEL_USER='dvmadmin'
PANEL_PASSWORD='DroidVM2026!'
PANEL_ENTRANCE='droidvm_panel'
PANEL_PORT=10086
